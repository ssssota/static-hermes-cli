name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
          - platform: linux-x64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      STATIC_HERMES_RELEASE_BUILD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Select package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >>"${GITHUB_ENV}"
          else
            echo "PACKAGE_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >>"${GITHUB_ENV}"
          fi

      - name: Build toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          BUILD_JOBS: "4"
        run: ./scripts/build.sh

      - name: Package toolchain
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./scripts/package.sh

      - name: Test relocated package
        if: runner.os == 'macOS'
        run: ./scripts/test-package.sh dist/*.tar.gz

      - name: Build and test Linux toolchain in Docker
        if: runner.os == 'Linux'
        env:
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          BUILD_JOBS: "4"
        run: ./scripts/build-linux.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-hermes-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        run: find dist -name '*.sha256' -exec cat {} + | LC_ALL=C sort >dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tar.gz dist/SHA256SUMS \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
