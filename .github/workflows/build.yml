name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (vYYYY.M.D); empty = today in Asia/Tokyo"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  metadata:
    name: Select build and release version
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      hermes_revision: ${{ steps.metadata.outputs.hermes_revision }}
    steps:
      - uses: actions/checkout@v7

      - name: Select version and source commits
        id: metadata
        uses: actions/github-script@v8
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        with:
          script: |
            let version;
            let tag = '';
            if (context.eventName === 'workflow_dispatch') {
              const requested = process.env.REQUESTED_VERSION || '';
              if (requested) {
                const match = /^v([0-9]{4})\.([1-9][0-9]?)\.([1-9][0-9]?)$/.exec(requested);
                if (!match || match[0] !== requested) {
                  throw new Error('Expected vYYYY.M.D, without zero padding (e.g. v2026.9.20)');
                }
                const [, year, month, day] = match;
                const date = new Date(`${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}T00:00:00Z`);
                if (Number(year) < 1 || date.getUTCFullYear() !== Number(year) ||
                    date.getUTCMonth() + 1 !== Number(month) || date.getUTCDate() !== Number(day)) {
                  throw new Error(`Invalid release date: ${requested}`);
                }
                version = requested.slice(1);
              } else {
                const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
                  timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric',
                }).formatToParts(new Date()).map(({ type, value }) => [type, value]));
                version = `${parts.year}.${parts.month}.${parts.day}`;
              }
              tag = `v${version}`;
            } else {
              version = `0.0.0-dev.${context.runNumber}`;
            }

            const git = async (...args) => {
              const { stdout } = await exec.getExecOutput('git', args, { silent: true });
              return stdout.trim();
            };
            const commit = await git('rev-parse', 'HEAD');
            const hermesRevision = await git('rev-parse', 'HEAD:hermes');
            if (tag) {
              const refs = await git('ls-remote', '--tags', 'origin', `refs/tags/${tag}`, `refs/tags/${tag}^{}`);
              const targets = new Map(refs.split('\n').filter(Boolean).map(line => {
                const [sha, ref] = line.split(/\s+/);
                return [ref, sha];
              }));
              const target = targets.get(`refs/tags/${tag}^{}`) ?? targets.get(`refs/tags/${tag}`);
              if (target !== undefined && target !== commit) {
                throw new Error(`${tag} already points to a different commit; choose another date`);
              }
            }

            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('commit', commit);
            core.setOutput('hermes_revision', hermesRevision);

  build:
    name: ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
          - platform: linux-x64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
          - platform: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      STATIC_HERMES_RELEASE_BUILD: "1"
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          submodules: true

      - name: Build toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          BUILD_JOBS: "4"
        run: ./scripts/build.sh

      - name: Package toolchain
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./scripts/package.sh

      - name: Test relocated package
        if: runner.os == 'macOS'
        run: ./scripts/test-package.sh dist/*.tar.gz

      - name: Build and test Linux toolchain in Docker
        if: runner.os == 'Linux'
        env:
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          BUILD_JOBS: "4"
        run: ./scripts/build-linux.sh

      - name: Build and test Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          ./scripts/package-windows.ps1
          ./scripts/test-package-windows.ps1 "dist/static-hermes-$env:PACKAGE_VERSION-windows-x64.tar.gz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-hermes-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [metadata, build]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        run: find dist -name '*.sha256' -exec cat {} + | LC_ALL=C sort >dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          HERMES_REVISION: ${{ needs.metadata.outputs.hermes_revision }}
        run: |
          # Check again after the build, in case another run created the tag.
          refs="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          target="$(awk '$2 !~ /\^\{\}$/ { plain=$1 } $2 ~ /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : plain }' <<<"${refs}")"
          if [[ -n "${target}" && "${target}" != "${RELEASE_COMMIT}" ]]; then
            echo "${RELEASE_TAG} already points to a different commit." >&2
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          printf 'https://github.com/facebook/hermes/commit/%s\n' "${HERMES_REVISION}" >"${notes}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber dist/*.tar.gz dist/SHA256SUMS
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes-file "${notes}"
          else
            gh release create "${RELEASE_TAG}" \
              dist/*.tar.gz dist/SHA256SUMS \
              --target "${RELEASE_COMMIT}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${notes}"
          fi
